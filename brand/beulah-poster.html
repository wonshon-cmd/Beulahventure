<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@200;400;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { background: #fff; }
body { font-family: "Gothic A1", sans-serif; color: #111; word-break: keep-all; -webkit-print-color-adjust: exact; }
.poster { width: 1080px; height: 1350px; position: relative; overflow: hidden; padding: 84px 88px 72px; display: flex; flex-direction: column; }
.top { display: flex; align-items: center; gap: 16px; }
.top svg { width: 40px; height: 47px; display: block; }
.top .wm { display: flex; flex-direction: column; justify-content: space-between; height: 47px; }
.top b { font-size: 31px; font-weight: 800; letter-spacing: -0.04em; line-height: 30px; }
.top small { font-size: 12px; letter-spacing: 0.34em; color: #707070; line-height: 12px; }
h1 { margin-top: 110px; font-size: 168px; line-height: 1.02; letter-spacing: -0.07em; font-weight: 200; }
h1 em { font-style: normal; font-weight: 800; }
.call { margin-top: 64px; font-size: 52px; line-height: 1.4; letter-spacing: -0.045em; font-weight: 400; }
.call strong { font-weight: 800; }
.river { position: absolute; left: 0; right: 0; bottom: 330px; height: 220px; overflow: visible; }
.foot { margin-top: auto; border-top: 2px solid #111; padding-top: 28px; display: flex; justify-content: space-between; align-items: flex-end; gap: 32px; }
.foot .left { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.foot .cohort { font-size: 20px; font-weight: 800; letter-spacing: 0.16em; color: #3b8fc4; }
.foot .what { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
.foot .ask { font-size: 24px; font-weight: 400; letter-spacing: -0.02em; color: #333; }
.foot .note { font-size: 14px; color: #888; }
.foot .qr { flex: none; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.foot .qr img { width: 176px; height: 176px; display: block; }
.foot .qr span { font-size: 13px; font-weight: 800; letter-spacing: 0.14em; }
</style></head><body>
<div class="poster">
  <div class="top">
    <svg viewBox="0 0 48 56"><path d="M0 0h34l10 9v14l-6 5 8 7v15l-8 6H0z M17 12v10h12v-10z M17 33v11h14v-11z" fill="#111" fill-rule="evenodd"/></svg>
    <div class="wm"><b>Beulah</b><small>VENTURES</small></div>
  </div>

  <h1>돈보다<br><em>가치.</em></h1>

  <p class="call">복음의 가치로 창업할 분,<br><strong>당신의 이야기를 들려주세요.</strong></p>

  <svg class="river" viewBox="0 0 1080 220" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0,150 C180,110 320,190 520,150 S860,100 1080,140" fill="none" stroke="#3b8fc4" stroke-width="2.5" opacity=".9"/>
    <path d="M0,172 C200,138 340,206 540,170 S880,128 1080,162" fill="none" stroke="#3b8fc4" stroke-width="1.2" opacity=".45"/>
    <!-- seeds growing: seed, sprout, sapling, tree -->
    <circle cx="600" cy="129" r="4" fill="#111"/>
    <g stroke="#111" stroke-width="2.2" fill="#fff" stroke-linecap="round" stroke-linejoin="round">
      <path d="M720,121 L720,104" fill="none"/>
      <path d="M720,108 C712,96 700,98 698,104 C706,110 714,110 720,108 Z"/>
      <path d="M720,104 C728,92 740,94 742,100 C734,106 726,106 720,104 Z"/>
      <path d="M820,116 L820,80" fill="none"/>
      <path d="M820,96 C806,82 790,86 788,94 C800,102 812,100 820,96 Z"/>
      <path d="M820,86 C834,72 850,76 852,84 C840,92 828,90 820,86 Z"/>
      <path d="M820,80 C812,66 816,56 820,54 C824,56 828,66 820,80 Z"/>
      <path d="M950,112 L950,58" fill="none" stroke-width="3"/>
      <path d="M950,74 L936,62 M950,84 L964,72" fill="none"/>
      <path d="M950,70 C918,72 904,52 914,34 C906,14 928,-2 944,8 C956,-6 982,2 980,20 C998,30 992,58 972,62 C966,72 956,72 950,70 Z"/>
    </g>
  </svg>

  <div class="foot">
    <div class="left">
      <div class="cohort">FIRST COHORT APPLICATION · 2027</div>
      <div class="what">창업 지원부터 투자까지 · Beulah Ventures</div>
      <div class="ask">모집 날짜가 궁금하다면, QR을 찍어 보세요.</div>
      <div class="note">투자는 선발과 심사를 거쳐 결정됩니다.</div>
    </div>
    <div class="qr"><img src="qr.svg" alt="QR: beulahventure.com"><span>BEULAHVENTURE.COM</span></div>
  </div>
</div>
</body></html>
