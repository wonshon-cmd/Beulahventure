<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@200;400;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
body { font-family: "Gothic A1", sans-serif; word-break: keep-all; }
.sc { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; padding: 0 96px; }
.w { background: #fff; color: #111; } .k { background: #111; color: #fff; } .b { background: #3b8fc4; color: #fff; }
.el { display: block; white-space: nowrap; }
.thin { font-weight: 200; } .bold { font-weight: 800; }
.c { align-items: center; text-align: center; }
.blue { color: #3b8fc4; }
</style></head><body>
<!-- Youth reel. Times in beats; 1 beat = 28 frames at 60 fps (128.6 BPM). -->
<div class="sc k c" data-s="0" data-e="1"><span class="el bold" data-in="0" data-fx="slam" style="font-size:270px;letter-spacing:-0.06em">창업?</span></div>
<div class="sc w c" data-s="1" data-e="2"><span class="el bold" data-in="1" data-fx="slam" style="font-size:270px;letter-spacing:-0.06em">복음?</span></div>
<div class="sc b c" data-s="2" data-e="3"><span class="el bold" data-in="2" data-fx="slam" style="font-size:270px;letter-spacing:-0.06em">가치?</span></div>
<div class="sc k" data-s="3" data-e="5">
  <span class="el thin" data-in="3" data-fx="up" style="font-size:112px;line-height:1.25;letter-spacing:-0.05em">창업을 고민하는</span>
  <span class="el bold" data-in="4" data-fx="slam" style="font-size:150px;line-height:1.25;letter-spacing:-0.05em">크리스천 청년에게.</span>
</div>
<div class="sc w" data-s="5" data-e="7">
  <span class="el thin" data-in="5" data-fx="up" style="font-size:150px;line-height:1.15;letter-spacing:-0.06em">복음 위에,</span>
  <span class="el bold" data-in="6" data-fx="slam" style="font-size:150px;line-height:1.15;letter-spacing:-0.06em">복음의 <span class="blue">가치로.</span></span>
</div>
<div class="sc k" data-s="7" data-e="9">
  <span class="el thin" data-in="7" data-fx="up" style="font-size:118px;line-height:1.25;letter-spacing:-0.05em">목적 위에 세우고,</span>
  <span class="el bold" data-in="8" data-fx="slam" style="font-size:160px;line-height:1.15;letter-spacing:-0.05em">인도하심으로</span>
  <span class="el bold" data-in="8" data-fx="slam" style="font-size:160px;line-height:1.15;letter-spacing:-0.05em">키웁니다.</span>
</div>
<div class="sc w" data-s="9" data-e="12" style="padding:0">
  <svg viewBox="0 0 1080 1920" width="1080" height="1920" style="position:absolute;inset:0">
    <path id="river1" d="M0,1180 C180,1120 320,1260 520,1190 S860,1110 1080,1170" fill="none" stroke="#3b8fc4" stroke-width="6"/>
    <path id="river2" d="M0,1230 C200,1180 340,1300 540,1240 S880,1170 1080,1220" fill="none" stroke="#3b8fc4" stroke-width="3" opacity=".45"/>
    <g stroke="#111" stroke-width="5" fill="#fff" stroke-linecap="round" stroke-linejoin="round">
      <g class="grow" data-in="9.5" style="transform-origin:240px 1160px"><circle cx="240" cy="1160" r="10" fill="#3b8fc4" stroke="none"/></g>
      <g class="grow" data-in="10" style="transform-origin:440px 1150px">
        <path d="M440,1150 L440,1110" fill="none"/><path d="M440,1118 C424,1094 400,1098 396,1110 C412,1122 428,1122 440,1118 Z"/><path d="M440,1110 C456,1086 480,1090 484,1102 C468,1114 452,1114 440,1110 Z"/>
      </g>
      <g class="grow" data-in="10.5" style="transform-origin:640px 1135px">
        <path d="M640,1135 L640,1055" fill="none"/><path d="M640,1090 C612,1062 580,1070 576,1086 C600,1102 624,1098 640,1090 Z"/><path d="M640,1070 C668,1042 700,1050 704,1066 C680,1082 656,1078 640,1070 Z"/><path d="M640,1055 C624,1027 632,1007 640,1003 C648,1007 656,1027 640,1055 Z"/>
      </g>
      <g class="grow" data-in="11" style="transform-origin:860px 1145px">
        <path d="M860,1145 L860,1010" fill="none" stroke-width="7"/><path d="M860,1050 L830,1024 M860,1075 L890,1050" fill="none"/>
        <path d="M860,1040 C796,1044 768,1004 788,968 C772,928 816,896 848,916 C872,888 924,904 920,940 C956,960 944,1016 904,1024 C892,1044 872,1044 860,1040 Z"/>
      </g>
    </g>
  </svg>
</div>
<div class="sc k" data-s="12" data-e="14">
  <span class="el thin" data-in="12" data-fx="up" style="font-size:118px;line-height:1.25;letter-spacing:-0.05em">혼자 고민하지 마세요.</span>
  <span class="el bold" data-in="13" data-fx="slam" style="font-size:150px;line-height:1.25;letter-spacing:-0.05em">함께 걷겠습니다.</span>
</div>
<div class="sc w" data-s="14" data-e="16">
  <span class="el thin" data-in="14" data-fx="up" style="font-size:120px;line-height:1.2;letter-spacing:-0.05em">Venture 101</span>
  <span class="el bold" data-in="15" data-fx="slam" style="font-size:210px;line-height:1.15;letter-spacing:-0.06em">2027 <span class="blue">첫 기수</span></span>
</div>
<div class="sc b c" data-s="16" data-e="17"><span class="el bold" data-in="16" data-fx="slam" style="font-size:170px;letter-spacing:-0.06em">지금 신청하세요</span></div>
<div class="sc w c" data-s="17" data-e="99">
  <div class="el" data-in="17" data-fx="slam" style="display:flex;align-items:center;gap:40px">
    <svg viewBox="0 0 48 56" style="width:170px;height:198px;display:block"><path d="M0 0h34l10 9v14l-6 5 8 7v15l-8 6H0z M17 12v10h12v-10z M17 33v11h14v-11z" fill="#111" fill-rule="evenodd"/></svg>
    <div style="display:flex;flex-direction:column;justify-content:space-between;height:198px;text-align:left">
      <b style="font-size:150px;font-weight:800;letter-spacing:-0.045em;line-height:140px">Beulah</b>
      <small style="font-size:40px;letter-spacing:0.36em;color:#707070;line-height:40px">VENTURES</small>
    </div>
  </div>
  <span class="el bold" data-in="17.5" data-fx="up" style="margin-top:120px;font-size:34px;letter-spacing:0.16em;color:#3b8fc4">BEULAHVENTURES.COM</span>
</div>

<script>
const FPB=28; // frames per beat at 60 fps (128.6 BPM)
const BUILD=16, END=17;
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
window.setFrame=function(f){
  const bt = f/FPB;
  let pulse = 1;
  if (bt < BUILD) { const ph=(f % FPB)/FPB; pulse = 1 + 0.03*Math.exp(-ph*9); }
  else if (bt < END) { const q=FPB/4, ph=(f % q)/q; pulse = 1 + 0.025*Math.exp(-ph*5); }
  document.querySelectorAll('.sc').forEach(s=>{ const on=(bt>=+s.dataset.s && bt<+s.dataset.e);
    s.style.display=on?'flex':'none'; s.style.transform=on?`scale(${pulse})`:''; });
  document.querySelectorAll('.el').forEach(e=>{
    const df = f - Math.round((+e.dataset.in)*FPB), fx = e.dataset.fx;
    if (df < 0) { e.style.opacity = 0; return; }
    e.style.opacity = 1;
    const k = ease(clamp(df/8,0,1));
    let tr='none';
    if(fx==='slam') tr=`scale(${1.14-0.14*k})`;
    if(fx==='up')   tr=`translateY(${(1-k)*24}px)`;
    e.style.transform=tr;
    e.style.transformOrigin = e.closest('.c') ? 'center' : 'left center';
  });
  ['river1','river2'].forEach(id=>{const r=document.getElementById(id); const L=r.getTotalLength();
    const p=ease(clamp((bt-9)/0.5,0,1)); r.style.strokeDasharray=L; r.style.strokeDashoffset=L*(1-p);});
  document.querySelectorAll('.grow').forEach(g=>{const df=f-Math.round((+g.dataset.in)*FPB); const p=df<0?0:ease(clamp((df+1)/8,0,1));
    g.style.transform=`scale(${p})`; g.style.opacity=p>0?1:0;});
};
// Shrink any text line that is wider than the safe width (1080 - 2*96)
(function fit(){
  const MAX = 888;
  document.querySelectorAll('.sc').forEach(s=>{
    const prev = s.style.display; s.style.display='flex';
    s.querySelectorAll('span.el').forEach(e=>{
      let fs = parseFloat(getComputedStyle(e).fontSize);
      while (e.scrollWidth > MAX && fs > 40) { fs -= 2; e.style.fontSize = fs + 'px'; }
    });
    s.style.display = prev;
  });
})();
setFrame(0);
</script>
</body></html>
