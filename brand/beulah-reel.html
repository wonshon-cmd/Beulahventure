<!doctype html><html lang="ko"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@200;400;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: #fff; }
body { font-family: "Gothic A1", sans-serif; word-break: keep-all; }
.sc { position: absolute; inset: 0; display: none; flex-direction: column; justify-content: center; padding: 0 96px; }
.w { background: #fff; color: #111; } .k { background: #111; color: #fff; } .b { background: #3b8fc4; color: #fff; }
.el { display: block; will-change: transform, opacity; }
.thin { font-weight: 200; } .bold { font-weight: 800; }
.c { text-align: center; align-items: center; }
.blue { color: #3b8fc4; }
.logo { position: absolute; top: 120px; left: 96px; display: flex; align-items: center; gap: 18px; }
.logo svg { width: 52px; height: 61px; display: block; }
.logo .wm { display: flex; flex-direction: column; justify-content: space-between; height: 61px; }
.logo b { font-size: 40px; font-weight: 800; letter-spacing: -0.04em; line-height: 38px; }
.logo small { font-size: 15px; letter-spacing: 0.34em; color: #707070; line-height: 15px; }
</style></head><body>

<!-- S1 -->
<div class="sc k c" data-s="0" data-e="0.5"><span class="el bold" data-in="0" data-fx="slam" style="font-size:260px;letter-spacing:-0.06em">돈?</span></div>
<!-- S2 -->
<div class="sc w c" data-s="0.5" data-e="1.0"><span class="el bold" data-in="0.5" data-fx="slam" style="font-size:260px;letter-spacing:-0.06em">아니.</span></div>
<!-- S3 -->
<div class="sc w" data-s="1.0" data-e="2.0">
  <span class="el thin" data-in="1.0" data-fx="up" style="font-size:200px;line-height:1.05;letter-spacing:-0.07em">돈보다</span>
  <span class="el bold" data-in="1.5" data-fx="slam" style="font-size:300px;line-height:1.05;letter-spacing:-0.07em">가치.</span>
</div>
<!-- S4 -->
<div class="sc k c" data-s="2.0" data-e="2.5"><span class="el bold" data-in="2.0" data-fx="slam" style="font-size:120px;letter-spacing:-0.05em">복음의 가치로</span></div>
<!-- S5 -->
<div class="sc b c" data-s="2.5" data-e="3.0"><span class="el bold" data-in="2.5" data-fx="slam" style="font-size:150px;letter-spacing:-0.05em">창업할 분,</span></div>
<!-- S6 flash words -->
<div class="sc w c" data-s="3.0" data-e="3.25"><span class="el bold" data-in="3.0" data-fx="pop" style="font-size:280px">소명</span></div>
<div class="sc k c" data-s="3.25" data-e="3.5"><span class="el bold" data-in="3.25" data-fx="pop" style="font-size:280px">정직</span></div>
<div class="sc w c" data-s="3.5" data-e="3.75"><span class="el bold blue" data-in="3.5" data-fx="pop" style="font-size:280px">동행</span></div>
<div class="sc k c" data-s="3.75" data-e="4.0"><span class="el bold" data-in="3.75" data-fx="pop" style="font-size:280px">열매</span></div>
<!-- S7 seed to tree -->
<div class="sc w" data-s="4.0" data-e="5.5" style="padding:0">
  <svg viewBox="0 0 1080 1920" width="1080" height="1920" style="position:absolute;inset:0">
    <path id="river1" d="M0,1180 C180,1120 320,1260 520,1190 S860,1110 1080,1170" fill="none" stroke="#3b8fc4" stroke-width="6"/>
    <path id="river2" d="M0,1230 C200,1180 340,1300 540,1240 S880,1170 1080,1220" fill="none" stroke="#3b8fc4" stroke-width="3" opacity=".45"/>
    <g stroke="#111" stroke-width="5" fill="#fff" stroke-linecap="round" stroke-linejoin="round">
      <g class="grow" data-in="4.5" style="transform-origin:240px 1160px"><circle cx="240" cy="1160" r="9" fill="#111" stroke="none"/></g>
      <g class="grow" data-in="4.75" style="transform-origin:440px 1150px">
        <path d="M440,1150 L440,1110" fill="none"/><path d="M440,1118 C424,1094 400,1098 396,1110 C412,1122 428,1122 440,1118 Z"/><path d="M440,1110 C456,1086 480,1090 484,1102 C468,1114 452,1114 440,1110 Z"/>
      </g>
      <g class="grow" data-in="5.0" style="transform-origin:640px 1135px">
        <path d="M640,1135 L640,1055" fill="none"/><path d="M640,1090 C612,1062 580,1070 576,1086 C600,1102 624,1098 640,1090 Z"/><path d="M640,1070 C668,1042 700,1050 704,1066 C680,1082 656,1078 640,1070 Z"/><path d="M640,1055 C624,1027 632,1007 640,1003 C648,1007 656,1027 640,1055 Z"/>
      </g>
      <g class="grow" data-in="5.25" style="transform-origin:860px 1145px">
        <path d="M860,1145 L860,1010" fill="none" stroke-width="7"/><path d="M860,1050 L830,1024 M860,1075 L890,1050" fill="none"/>
        <path d="M860,1040 C796,1044 768,1004 788,968 C772,928 816,896 848,916 C872,888 924,904 920,940 C956,960 944,1016 904,1024 C892,1044 872,1044 860,1040 Z"/>
      </g>
    </g>
  </svg>
</div>
<!-- S8 -->
<div class="sc k" data-s="5.5" data-e="6.5">
  <span class="el thin" data-in="5.5" data-fx="up" style="font-size:120px;line-height:1.25;letter-spacing:-0.05em">당신의 이야기를</span>
  <span class="el bold" data-in="6.0" data-fx="slam" style="font-size:150px;line-height:1.25;letter-spacing:-0.05em">들려주세요.</span>
</div>
<!-- S9 -->
<div class="sc w" data-s="6.5" data-e="7.5">
  <span class="el thin" data-in="6.5" data-fx="up" style="font-size:130px;line-height:1.2;letter-spacing:-0.05em">창업 지원부터</span>
  <span class="el bold blue" data-in="7.0" data-fx="slam" style="font-size:210px;line-height:1.2;letter-spacing:-0.06em">투자까지.</span>
</div>
<!-- S10 end card -->
<div class="sc w" data-s="7.5" data-e="99" style="justify-content:flex-start;padding-top:330px">
  <div class="logo el" data-in="7.5" data-fx="fade"><svg viewBox="0 0 48 56"><path d="M0 0h34l10 9v14l-6 5 8 7v15l-8 6H0z M17 12v10h12v-10z M17 33v11h14v-11z" fill="#111" fill-rule="evenodd"/></svg><div class="wm"><b>Beulah</b><small>VENTURES</small></div></div>
  <span class="el bold blue" data-in="7.5" data-fx="up" style="font-size:34px;letter-spacing:0.16em">FIRST COHORT APPLICATION</span>
  <span class="el bold" data-in="7.65" data-fx="slam" style="font-size:300px;line-height:1;letter-spacing:-0.06em;margin-top:18px">2027</span>
  <span class="el thin" data-in="7.85" data-fx="up" style="font-size:64px;line-height:1.35;letter-spacing:-0.04em;margin-top:40px">돈보다 가치.<br><b style="font-weight:800">당신의 이야기를 들려주세요.</b></span>
  <div class="el" data-in="8.1" data-fx="up" style="margin-top:110px;display:flex;align-items:flex-end;justify-content:space-between;border-top:3px solid #111;padding-top:44px">
    <div>
      <div style="font-size:56px;font-weight:800;letter-spacing:-0.03em">모집 마감일 :</div>
      <div style="margin-top:18px;font-size:22px;color:#888">투자는 선발과 심사를 거쳐 결정됩니다.</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
      <img src="qr.svg" style="width:330px;height:330px;display:block" alt="">
      <span style="font-size:22px;font-weight:800;letter-spacing:0.14em">BEULAHVENTURES.COM</span>
    </div>
  </div>
</div>

<script>
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-x,3);
window.setT=function(t){
  document.querySelectorAll('.sc').forEach(s=>{ s.style.display=(t>=+s.dataset.s && t<+s.dataset.e)?'flex':'none'; });
  document.querySelectorAll('.el').forEach(e=>{
    const p=clamp((t-+e.dataset.in)/(e.dataset.fx==='pop'?0.08:0.14),0,1), k=ease(p), fx=e.dataset.fx;
    let tr='none';
    if(fx==='slam') tr=`scale(${1.35-0.35*k})`;
    if(fx==='pop') tr=`scale(${0.7+0.3*k})`;
    if(fx==='up') tr=`translateY(${(1-k)*60}px)`;
    e.style.opacity=p; e.style.transform=tr; e.style.transformOrigin=fx==='slam'||fx==='pop'?'left center':'';
    if(e.closest('.c')) e.style.transformOrigin='center';
  });
  // river draw + growth
  ['river1','river2'].forEach((id,i)=>{const r=document.getElementById(id); const L=r.getTotalLength(); r.style.strokeDasharray=L; r.style.strokeDashoffset=L*(1-ease(clamp((t-4.0-i*0.08)/0.45,0,1)));});
  document.querySelectorAll('.grow').forEach(g=>{const p=ease(clamp((t-+g.dataset.in)/0.18,0,1)); g.style.transform=`scale(${p})`; g.style.opacity=p>0?1:0;});
};
setT(0);
</script>
</body></html>
